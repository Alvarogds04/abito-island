<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <!-- M1b: strict CSP in tauri.conf.json — no remote origins, no
       unsafe-eval, no inline script/style (this file carries none). -->
  <title>Abito</title>
  <link rel="stylesheet" href="style.css">
  <!-- Frozen R6, copied byte-for-byte (sha256 e2dc5db3…): SVG-DOM, never redrawn. -->
  <script defer src="clay-engine.js"></script>
  <!-- window.desktop facade must exist before the island boots. -->
  <script defer src="desktop.js"></script>
  <!-- UI.1: own icons + pure overview view-model, before the island boots. -->
  <script defer src="icons.js"></script>
  <script defer src="overview-view.js"></script>
  <!-- N6: notification with 1..N reply options (Pi questions QP/1 are one case). -->
  <script defer src="notify-view.js"></script>
  <script defer src="island.js"></script>
  <!-- U1: pure chat view helpers + the chat surface (same island). -->
  <script defer src="chat-view.js"></script>
  <script defer src="chat.js"></script>
  <script defer src="models.js"></script>
  <script defer src="notify.js"></script>
</head>
<body>
  <main id="capsule" data-phase="compact" data-edge="top">
    <div id="island">
      <!-- Q1: the island's own keyboard control (visually it IS the island:
           its focus ring is drawn on #island). Enter/Space opens the
           overview from compact; in the overview it closes it. -->
      <button id="island-toggle" type="button" class="sr-only" aria-expanded="false">Abrir Abito</button>
      <!-- UI.2: compact indicator (§6): sun dot = something waits for your yes,
           red triangle = channel down. Shape + colour; never text. -->
      <span id="compact-flag" role="img" hidden><span class="ico" id="compact-flag-icon"></span></span>
      <svg id="clay" aria-hidden="true" focusable="false"></svg>
      <!-- UI.1: visual overview (docs/desktop-visual-language.md). Icons come
           from icons.js (own inline SVG); every icon-only control has an
           aria-label; long sentences live behind the «i» buttons. -->
      <!-- U1: the overview's primary control. Opens the chat view of THIS
           island (no other window). Enter in the overview does the same. -->
      <button id="open-chat" type="button" aria-label="Conversar con Abito" aria-describedby="open-chat-hint"><span class="ico" data-icon="bubble"></span></button>
      <span id="open-chat-hint" class="sr-only">Abre la conversación con el modelo local dentro de la isla.</span>
      <!-- M2: Sileo-style notice, display only (own code, silence).
           A notice never decides or approves anything. -->
      <div id="notices" hidden>
        <div id="notice-row">
          <span id="connection" class="chip" role="img"><span class="ico" id="connection-icon"></span><span class="word" id="connection-word"></span></span>
          <span id="bridge" class="chip" role="img" hidden><span class="ico" id="bridge-icon"></span><span class="word" id="bridge-word"></span></span>
          <button id="notice-info" class="icon-btn" type="button" aria-label="Ver detalle de la conexión" aria-expanded="false" aria-controls="notice-detail"><span class="ico" data-icon="info"></span></button>
        </div>
        <div id="notice-pill" role="group" hidden>
          <span id="notice-ring"></span>
          <strong id="notice-title"></strong>
          <span id="notice-count"></span>
          <button id="notice-dismiss" class="icon-btn" type="button" aria-label="Descartar aviso"><span class="ico" data-icon="cross"></span></button>
        </div>
        <p id="notice-detail" hidden></p>
      </div>
      <!-- Q1: notices are announced once to screen readers (polite). -->
      <p id="notice-live" class="sr-only" role="status" aria-live="polite"></p>
      <!-- M3: approval card — DISPLAY only. The renderer sends nothing but
           the human's click (`allow`/`deny`, zero arguments); Rust
           re-validates card id, expiry and payload_hash before any
           /execute. An untrusted or stale click can never approve. -->
      <div id="permission" hidden aria-label="Decisión pendiente">
        <div id="card-head">
          <span id="card-status" class="chip" role="img"><span class="ico" id="card-status-icon"></span><span class="word" id="card-status-word"></span></span>
          <span id="card-expiry" class="chip" role="img"><span class="ico" data-icon="clock"></span><time class="word" id="expiry"></time></span>
          <span id="card-conn" class="chip" role="img" hidden><span class="ico" id="card-conn-icon"></span><span class="word" id="card-conn-word"></span></span>
          <span id="card-bridge" class="chip" role="img" hidden><span class="ico" id="card-bridge-icon"></span><span class="word" id="card-bridge-word"></span></span>
          <button id="card-info" class="icon-btn" type="button" aria-label="Ver detalle de la decisión" aria-expanded="false" aria-controls="card-reason"><span class="ico" data-icon="info"></span></button>
        </div>
        <p id="operation"></p>
        <p id="card-reason" role="status" hidden></p>
        <div id="card-actions">
          <button id="allow" type="button" disabled aria-describedby="card-reason"><span class="ico" data-icon="check"></span><span class="btn-word">Permitir</span></button>
          <button id="deny" type="button" disabled aria-describedby="card-reason"><span class="ico" data-icon="cross"></span><span class="btn-word">Denegar</span></button>
        </div>
      </div>
      <!-- N6: Pi question / notification with 1..N reply options. DISPLAY only:
           the renderer sends nothing but the human's trusted click or key
           (index, text or decline); Rust validates id, scope, expiry and size.
           It is NOT an Abito approval: it authorizes nothing in the backend.
           All text is written with textContent. -->
      <div id="question" inert aria-label="Pi pregunta">
        <div id="question-head">
          <span id="question-expiry" class="chip" role="img"><span class="ico" data-icon="clock"></span><time class="word" id="question-expiry-word"></time></span>
          <span id="question-state" class="chip" role="img" hidden><span class="ico" id="question-state-icon"></span><span class="word" id="question-state-word"></span></span>
          <p id="question-body"></p>
          <button id="question-skip" type="button"><span class="ico" data-icon="cross"></span><span class="btn-word">Omitir</span></button>
        </div>
        <div id="question-options" role="group" aria-label="Opciones de respuesta"></div>
        <form id="question-freeform" hidden novalidate>
          <label for="question-text" class="sr-only">Tu respuesta</label>
          <textarea id="question-text" rows="1" maxlength="2000" spellcheck="true" placeholder="Escribí…" aria-describedby="question-word"></textarea>
          <span id="question-word" class="chip" data-tone="red" hidden></span>
          <button id="question-send" type="submit" disabled aria-label="Enviar respuesta"><span class="ico" data-icon="arrow-up"></span></button>
        </form>
        <p id="question-live" class="sr-only" role="status" aria-live="polite"></p>
      </div>
      <!-- U1: chat view — same island, 640x240 (geometry::CHAT_VISIBLE).
           Every text below is written with textContent: plain text only. -->
      <section id="chat" inert aria-label="Conversación con Abito">
        <header id="chat-header">
          <span id="chat-target-chip" class="chip" role="img"><span class="ico" data-icon="lock"></span><span class="word">local</span></span>
          <span id="chat-state" class="chip" role="img"><span class="ico" id="chat-state-icon"></span><span class="word" id="chat-state-word"></span></span>
          <span id="chat-target" class="sr-only"></span>
          <p id="chat-status" class="sr-only"></p>
          <button id="chat-models" class="icon-btn" type="button" aria-label="Modelo local" aria-expanded="false" aria-controls="models"><span class="ico" data-icon="chip"></span></button>
          <button id="chat-back" class="icon-btn" type="button" aria-label="Volver"><span class="ico" data-icon="arrow-left"></span></button>
        </header>
        <div id="chat-body">
          <ol id="chat-log" tabindex="0" aria-label="Historial de la conversación"></ol>
          <button id="chat-new" type="button" hidden aria-label="Respuesta nueva"><span class="ico" data-icon="arrow-down"></span><span class="dot"></span></button>
          <form id="chat-composer" novalidate>
            <label for="chat-input" class="sr-only">Mensaje para Abito</label>
            <textarea id="chat-input" rows="1" maxlength="8000" spellcheck="true"
              aria-describedby="chat-help chat-problem" placeholder="Escribí…"></textarea>
            <span id="chat-draft-word" class="chip" data-tone="red" hidden></span>
            <span id="chat-help" class="sr-only">Enter envía. Mayúsculas más Enter agrega una línea. Escape sale del campo; otro Escape cierra la isla.</span>
            <button id="chat-cancel" class="round" type="button" hidden aria-label="Cancelar"><span class="ico" data-icon="square"></span></button>
            <button id="chat-send" class="round" type="submit" disabled aria-label="Enviar"><span class="ico" data-icon="arrow-up"></span></button>
          </form>
          <p id="chat-problem" class="sr-only" aria-live="polite"></p>
        </div>
        <!-- U2: self-hosted model choice — an internal panel of the same
             island (replaces the transcript while open). Local only, no
             keys; listed is never shown as ready. -->
        <div id="models" inert aria-label="Modelo local">
          <div id="models-bar">
            <span id="models-count" class="chip" role="img"><span class="ico" data-icon="chip"></span><span class="word" id="models-count-word"></span></span>
            <button id="models-info" class="icon-btn" type="button" aria-label="Ver detalle de los modelos" aria-expanded="false" aria-controls="models-note"><span class="ico" data-icon="info"></span></button>
            <ul id="models-meters" aria-label="Recursos de esta máquina"></ul>
            <button id="models-refresh" class="icon-btn" type="button" aria-label="Actualizar modelos locales"><span class="ico" data-icon="refresh"></span></button>
            <button id="models-close" class="icon-btn" type="button" aria-label="Listo, volver a la conversación"><span class="ico" data-icon="check"></span></button>
          </div>
          <p id="models-note" class="sr-only"></p>
          <ul id="models-list" aria-label="Modelos locales"></ul>
          <p id="models-resources" class="sr-only"></p>
        </div>
        <p id="chat-live" class="sr-only" role="status" aria-live="polite"></p>
      </section>
    </div>
  </main>
</body>
</html>
