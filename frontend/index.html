<!doctype html>
<html lang="es" data-motion="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <!-- M1b: strict CSP in tauri.conf.json — no remote origins, no
       unsafe-eval, no inline script/style (this file carries none). -->
  <title>Abito</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chat-markdown.css">
  <!-- R7 clay character (sha256 b699ebbc…): Abito's own SVG-DOM, no reserved assets. -->
  <script defer src="clay-engine.js"></script>
  <!-- window.desktop facade must exist before the island boots. -->
  <script defer src="desktop.js"></script>
  <!-- UI.1: own icons + pure overview view-model, before the island boots. -->
  <script defer src="icons.js"></script>
  <!-- #384: the Dot's colour contract (pure) — loaded before the island and the settings panel,
       the two places that consume it. -->
  <script defer src="avatar-colors.js"></script>
  <!-- #380: system/light/dark theme — paints <html data-theme> from the saved preference
       before the island draws, so the palette is never flashed wrong. -->
  <script defer src="theme.js"></script>
  <script defer src="overview-view.js"></script>
  <!-- #345 catalog choices are local preferences, never live connector claims. -->
  <script defer src="pill-catalog.js"></script>
  <script defer src="pills.js"></script>
  <script defer src="pills-view.js"></script>
  <!-- N6: notification with 1..N reply options (Pi questions QP/1 are one case). -->
  <script defer src="notify-view.js"></script>
  <script defer src="character-motion.js"></script>
  <script defer src="character-minibots.js"></script>
  <script defer src="sound-engine.js"></script>
  <script defer src="sound-wiring.js"></script>
  <script defer src="island.js"></script>
  <!-- U1: pure chat view helpers + the chat surface (same island). -->
  <script defer src="chat-markdown.js"></script>
  <script defer src="chat-view.js"></script>
  <script defer src="chat-cards.js"></script>
  <script defer src="chat.js"></script>
  <script defer src="models.js"></script>
  <!-- #306: settings panel (providers, connectors, general). -->
  <script defer src="pill-settings.js"></script>
  <script defer src="settings-view.js"></script>
  <script defer src="settings.js"></script>
  <!-- #327: manual specialists — the pure view-model first, then its section in Ajustes. -->
  <script defer src="specialists-view.js"></script>
  <script defer src="specialists.js"></script>
  <script defer src="notify.js"></script>
</head>
<body>
  <main id="capsule" data-phase="compact" data-edge="top">
    <div id="island">
      <!-- Q1: the island's own keyboard control (visually it IS the island:
           its focus ring is drawn on #island). Enter/Space opens the
           overview from compact; in the overview it closes it. -->
      <button id="island-toggle" type="button" class="sr-only" aria-expanded="false">Abrir Abito</button>
      <!-- UI.2: compact indicator (§6): sun dot = something waits for your yes,
           red triangle = channel down. Shape + colour; never text. -->
      <span id="compact-flag" role="img" hidden><span class="ico" id="compact-flag-icon"></span></span>
      <svg id="clay" aria-hidden="true" focusable="false"></svg>
      <!-- UI.1: visual overview (docs/desktop-visual-language.md). Icons come
           from icons.js (own inline SVG); every icon-only control has an
           aria-label; long sentences live behind the «i» buttons. -->
      <!-- U1: the overview's primary control. Opens the chat view of THIS
           island (no other window). Enter in the overview does the same. -->
      <header id="island-header" class="hdr" aria-label="Vistas de Abito">
        <div class="tabs" role="group" aria-label="Vistas">
          <button id="home-tab" class="tab on" type="button" aria-label="Vista general" aria-pressed="true"><span class="ico"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2.25 7.1 8 2.5l5.75 4.6M4 6.1v7h8v-7M6.5 13.1V9h3v4.1"/></svg></span></button>
          <button id="open-chat" class="tab" type="button" aria-label="Conversar con Abito" aria-describedby="open-chat-hint" aria-pressed="false"><span class="ico" data-icon="bubble"></span></button>
        </div>
        <button id="open-settings" class="hdr-action" type="button" aria-label="Ajustes"><span class="ico" data-icon="gear"></span></button>
      </header>
      <section id="overview-view" aria-label="Vista general">
        <div class="card card-left">
          <div class="agentline"><strong>Abito</strong><span id="overview-status" class="source"></span></div>
          <p id="overview-detail" class="overview-detail"></p>
          <div class="pill-summary">
            <strong id="pill-name"></strong><span id="pill-state" class="source"></span>
            <p id="pill-detail"></p>
          </div>
        </div>
        <div id="pill-choices" class="card" role="group" aria-label="Pills declaradas"></div>
        <span id="pill-live" class="sr-only" role="status" aria-live="polite"></span>
        <ul id="minibots" aria-label="Turnos activos" hidden></ul>
      </section>
      <span id="open-chat-hint" class="sr-only">Abre la conversación con el modelo local dentro de la isla.</span>
      <!-- M2: Sileo-style notice, display only (own code, silence).
           A notice never decides or approves anything. -->
      <div id="notices" hidden>
        <div id="notice-row">
          <span id="connection" class="chip" role="img"><span class="ico" id="connection-icon"></span><span class="word" id="connection-word"></span></span>
          <span id="hotkey" class="chip" role="img" hidden><span class="ico" id="hotkey-icon"></span><span class="word" id="hotkey-word"></span></span>
          <span id="bridge" class="chip" role="img" hidden><span class="ico" id="bridge-icon"></span><span class="word" id="bridge-word"></span></span>
          <button id="notice-info" class="icon-btn" type="button" aria-label="Ver detalle de la conexión" aria-expanded="false" aria-controls="notice-detail"><span class="ico" data-icon="info"></span></button>
        </div>
        <div id="notice-pill" role="group" hidden>
          <button id="notice-open" type="button" aria-label="Abrir aviso en Abito" aria-describedby="notice-title notice-detail">
            <span id="notice-ring"></span>
            <strong id="notice-title"></strong>
            <span id="notice-count"></span>
          </button>
          <button id="notice-dismiss" class="icon-btn" type="button" aria-label="Descartar aviso"><span class="ico" data-icon="cross"></span></button>
        </div>
        <p id="notice-detail" hidden></p>
      </div>
      <!-- Q1: notices are announced once to screen readers (polite). -->
      <p id="notice-live" class="sr-only" role="status" aria-live="polite"></p>
      <!-- M3: approval card — DISPLAY only. The renderer sends nothing but
           the human's click (`allow`/`deny`, zero arguments); Rust
           re-validates card id, expiry and payload_hash before any
           /execute. An untrusted or stale click can never approve. -->
      <div id="permission" class="card full wash" hidden aria-label="Decisión pendiente">
        <div id="card-head">
          <span id="card-status" class="chip" role="img"><span class="ico" id="card-status-icon"></span><span class="word" id="card-status-word"></span></span>
          <span id="card-expiry" class="chip" role="img"><span class="ico" data-icon="clock"></span><time class="word" id="expiry"></time></span>
          <span id="card-conn" class="chip" role="img" hidden><span class="ico" id="card-conn-icon"></span><span class="word" id="card-conn-word"></span></span>
          <span id="card-bridge" class="chip" role="img" hidden><span class="ico" id="card-bridge-icon"></span><span class="word" id="card-bridge-word"></span></span>
          <button id="card-info" class="icon-btn" type="button" aria-label="Ver detalle de la decisión" aria-expanded="false" aria-controls="card-reason"><span class="ico" data-icon="info"></span></button>
          <!-- F014 (#338): fold the waiting card down to the compact island
               WITHOUT deciding it (upstream `foldApproval`, windows
               /src/island/island.ts:144-154): the host keeps the card, the
               request keeps waiting, reopening shows it again. -->
          <button id="card-fold" class="icon-btn" type="button" aria-label="Plegar la tarjeta y dejar la solicitud esperando"><span class="ico" data-icon="arrow-up"></span></button>
        </div>
        <p id="operation"></p>
        <p id="card-reason" role="status" hidden></p>
        <div id="card-actions">
          <button id="allow" type="button" disabled aria-describedby="card-reason"><span class="ico" data-icon="check"></span><span class="btn-word">Permitir</span></button>
          <button id="deny" type="button" disabled aria-describedby="card-reason"><span class="ico" data-icon="cross"></span><span class="btn-word">Denegar</span></button>
        </div>
      </div>
      <!-- N6: Pi question / notification with 1..N reply options. DISPLAY only:
           the renderer sends nothing but the human's trusted click or key
           (index, text or decline); Rust validates id, scope, expiry and size.
           It is NOT an Abito approval: it authorizes nothing in the backend.
           All text is written with textContent. -->
      <div id="question" class="card full wash" inert aria-label="Pi pregunta">
        <div id="question-head">
          <span id="question-asker" class="chip"></span>
          <span id="question-expiry" class="chip" role="img"><span class="ico" data-icon="clock"></span><time class="word" id="question-expiry-word"></time></span>
          <span id="question-state" class="chip" role="img" hidden><span class="ico" id="question-state-icon"></span><span class="word" id="question-state-word"></span></span>
          <p id="question-body"></p>
          <button id="question-skip" type="button"><span class="ico" data-icon="cross"></span><span class="btn-word">Omitir</span></button>
        </div>
        <div id="question-options" role="group" aria-label="Opciones de respuesta"></div>
        <form id="question-freeform" hidden novalidate>
          <label for="question-text" class="sr-only">Tu respuesta</label>
          <textarea id="question-text" rows="1" maxlength="2000" spellcheck="true" placeholder="Escribí…" aria-describedby="question-word"></textarea>
          <span id="question-word" class="chip" data-tone="red" hidden></span>
          <button id="question-send" type="submit" disabled aria-label="Enviar respuesta"><span class="ico" data-icon="arrow-up"></span></button>
        </form>
        <p id="question-live" class="sr-only" role="status" aria-live="polite"></p>
      </div>
      <!-- #309: chat view — a vertical column of the same island (geometry::chat_visible: 400 wide, height from the work area).
           Every text below is written with textContent: plain text only. -->
      <section id="chat" inert aria-label="Conversación con Abito">
        <header id="chat-header">
          <span id="chat-target-chip" class="chip" role="img"><span class="ico" data-icon="lock"></span><span class="word">local</span></span>
          <span id="chat-target" class="sr-only"></span>
          <!-- #327: the role in use, when the human chose one. Status only: the role itself is
               chosen in Ajustes -> Especialistas, and a role never appears here by itself. -->
          <span id="chat-specialist" class="chip" role="img" hidden><span class="ico" id="chat-specialist-icon" data-icon="user"></span><span class="word" id="chat-specialist-word"></span></span>
          <p id="chat-status" class="sr-only"></p>
          <button id="open-screen-settings" class="icon-btn" type="button" aria-label="Ajustes" aria-expanded="false" aria-controls="settings"><span class="ico" data-icon="gear"></span></button>
          <button id="chat-back" class="icon-btn" type="button" aria-label="Volver"><span class="ico" data-icon="arrow-left"></span></button>
        </header>
        <!-- #309: the agent state is its own full-width strip between the header and the history -->
        <div id="chat-status-strip">
          <span id="chat-state" class="chip" role="img"><span class="ico" id="chat-state-icon"></span><span class="word" id="chat-state-word"></span></span>
        </div>
        <p id="chat-history-warning" role="status" hidden></p>
        <div id="conversations" role="dialog" aria-label="Conversaciones guardadas" hidden inert>
          <div id="conversations-bar"><h2>Conversaciones</h2><button id="conversations-close" class="icon-btn" type="button" aria-label="Volver al chat"><span class="ico" data-icon="cross"></span></button></div>
          <p id="conversations-note" role="status"></p>
          <ul id="conversations-list" aria-label="Conversaciones guardadas"></ul>
        </div>
        <div id="chat-body">
          <div id="chat-history-controls" role="group" aria-label="Conversaciones">
            <button id="chat-create" class="icon-btn" type="button" aria-label="Nueva conversación (Ctrl+N)" title="Nueva conversación (Ctrl+N)"><span class="ico" data-icon="bubble"></span></button>
            <button id="chat-conversations" class="icon-btn" type="button" aria-label="Conversaciones guardadas" aria-expanded="false" aria-controls="conversations"><span class="ico" data-icon="clock"></span></button>
          </div>
          <ol id="chat-log" tabindex="0" aria-label="Historial de la conversación"></ol>
          <button id="chat-new" type="button" hidden aria-label="Respuesta nueva"><span class="ico" data-icon="arrow-down"></span><span class="dot"></span></button>
          <!-- F024: the model row above the composer — the LOCAL model of the NEXT turn
               (chat:state.target, already resolved by Rust) and its picker. The picker reads
               the SAME closed `models_action` set as Ajustes → Modelos (list/select): it can
               never name an endpoint, a key, an account or a provider (S5). Plain text only. -->
          <div id="chat-model-row">
            <button id="chat-model-btn" type="button" disabled aria-expanded="false" aria-controls="chat-model-picker">
              <span class="model-dot" aria-hidden="true"></span>
              <span class="word" id="chat-model-name"></span>
              <span class="model-caret" aria-hidden="true"></span>
            </button>
            <div id="chat-model-picker" role="group" aria-label="Modelos locales" hidden inert>
              <p id="chat-model-note" class="picker-note"></p>
            </div>
          </div>
          <form id="chat-composer" novalidate>
            <label for="chat-input" class="sr-only">Mensaje para Abito</label>
            <textarea id="chat-input" rows="1" maxlength="8000" spellcheck="true"
              aria-describedby="chat-help chat-problem" placeholder="Escribí…"></textarea>
            <span id="chat-draft-word" class="chip" data-tone="red" hidden></span>
            <span id="chat-help" class="sr-only">Enter envía. Mayúsculas más Enter agrega una línea. Ctrl+N crea una conversación sin borrar el historial. Escape sale del campo; otro Escape cierra la isla.</span>
            <button id="chat-cancel" class="round" type="button" hidden aria-label="Cancelar"><span class="ico" data-icon="square"></span></button>
            <button id="chat-send" class="round" type="submit" disabled aria-label="Enviar"><span class="ico" data-icon="arrow-up"></span></button>
          </form>
          <p id="chat-problem" class="sr-only" aria-live="polite"></p>
        </div>
        <!-- #408: ONE Ajustes entry (the gear) with sub-tabs (settings-view.js TABS: Cuentas, Conectores, Modelos,
             Especialistas, Pills, Apariencia, General); the panel covers the chat body with a title, a tablist, a close button and a one-line hint. Plain text
             only (textContent); a key is typed into a masked field, sent once as `auth_reply` and cleared. -->
        <div id="settings" inert role="dialog" aria-labelledby="settings-title" aria-label="Ajustes">
          <div id="settings-bar">
            <h2 id="settings-title"></h2>
            <span id="settings-conn" class="chip" role="img" hidden><span class="ico" id="settings-conn-icon"></span><span class="word" id="settings-conn-word"></span></span>
            <button id="settings-close" class="icon-btn" type="button" aria-label="Cerrar ajustes"><span class="ico" data-icon="cross"></span></button>
          </div>
          <div id="settings-tabs" role="tablist" aria-label="Secciones de Ajustes" aria-orientation="horizontal"></div>
          <p id="settings-hint" class="snote"></p>
          <div id="settings-body" tabindex="-1" role="tabpanel"></div>
          <!-- U2: self-hosted model choice — an internal panel of the same
               island (replaces the transcript while open). Local only, no
               keys; listed is never shown as ready. -->
          <div id="models" inert role="tabpanel" aria-labelledby="settings-tab-models" aria-label="Modelo local">
            <!-- #309: the buttons come first so wrapping pushes the meters to a second row, never a button out of the island -->
            <div id="models-bar">
              <span id="models-count" class="chip" role="img"><span class="ico" data-icon="chip"></span><span class="word" id="models-count-word"></span></span>
              <button id="models-info" class="icon-btn" type="button" aria-label="Ver detalle de los modelos" aria-expanded="false" aria-controls="models-note"><span class="ico" data-icon="info"></span></button>
              <button id="models-refresh" class="icon-btn" type="button" aria-label="Actualizar modelos locales"><span class="ico" data-icon="refresh"></span></button>
              <ul id="models-meters" aria-label="Recursos de esta máquina"></ul>
            </div>
            <p id="models-note" class="sr-only"></p>
            <label class="models-search-field" for="models-search"><span class="sr-only">Buscar modelos locales</span><input id="models-search" type="search" placeholder="Buscar modelos" autocomplete="off"></label>
            <ul id="models-list" aria-label="Modelos locales"></ul>
            <p id="models-resources" class="sr-only"></p>
          </div>
          <p id="settings-live" class="sr-only" role="status" aria-live="polite"></p>
        </div>
        <p id="chat-live" class="sr-only" role="status" aria-live="polite"></p>
      </section>
    </div>
  </main>
</body>
</html>
