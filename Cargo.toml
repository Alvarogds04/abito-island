[package]
name = "abito-island"
version = "0.1.0"
edition = "2021"
description = "Abito island — Electron to Rust+Tauri migration, unit M1a (skeleton)"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x11rb = "0.13"
