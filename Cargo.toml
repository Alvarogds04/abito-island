[package]
name = "abito-island"
version = "0.1.0"
edition = "2021"
description = "Abito island — Electron to Rust+Tauri migration, unit M1b (host/bridge)"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x11rb = "0.13"
# M1b lifecycle: a second launch focuses/shows the running island and exits.
tauri-plugin-single-instance = "2"
