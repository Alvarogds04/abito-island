[package]
name = "abito-island"
version = "0.1.0"
edition = "2021"
description = "Abito island — Electron to Rust+Tauri migration, unit M2 (host/bridge + Pi transport receiver)"
publish = false

[features]
# Test/probe scaffolding (fake backend/model, read-back probe). Always on in debug
# builds; OFF in the packaged release so `--probe`/ABITO_PROBE cannot do anything.
probe = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `xkb`: detectable auto-repeat for the global hotkey. XTest (synthetic input) is
# deliberately NOT here: it lives in [dev-dependencies] so the shipped binary never
# compiles the input-injection module.
x11rb = { version = "0.13", features = ["xkb"] }
# #305b: the XDG GlobalShortcuts portal client. NOT ashpd (absent from the offline registry,
# downloads are forbidden): zbus is ALREADY compiled in via tauri-plugin-single-instance, so
# this declares the same crate/version/features and adds nothing to Cargo.lock.
zbus = { version = "5.19", default-features = true }
# Read-only native audit uses the exact GTK already resolved by Tauri.
gtk = "=0.18.2"
# M1b lifecycle: a second launch focuses/shows the running island and exits.
tauri-plugin-single-instance = "2"
# M2 transport: Linux UDS peer credentials + SIGINT/SIGTERM cleanup (libc),
# sha256 project id — byte-identical to core.cjs projectId (sha2 hex).
libc = "0.2"
sha2 = "0.10"

[dev-dependencies]
# tests only: fake key presses on a PRIVATE Xvfb (tests/hotkey_x11.rs). Never shipped.
x11rb = { version = "0.13", features = ["xtest"] }
